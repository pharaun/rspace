[package]
name = "rcore"
version = "0.1.0"
authors = ["Anja Berens <pharaun666@gmail.com>"]
edition = "2024"

[lints]
workspace = true

[features]
# For debugging shaders
shader-debug = []

# To permit headless builds for testing core simulation logic
default = ["render"]
render = [
    # Ship shape tessellation
    "dep:lyon_tessellation",

    # Debug gizmos
    "avian2d/debug-plugin",

    # Bevy functionality:
    "bevy/bevy_color",         # Provides shared color types and operations
    "bevy/bevy_core_pipeline", # Common rendering abstractions
    "bevy/bevy_gizmos",        # Support drawing debug lines and shapes
    "bevy/bevy_gizmos_render", # Support rendering the gizmos
    "bevy/bevy_material",      # Materials
    "bevy/bevy_render",        # Rendering framework core
    "bevy/bevy_scene",         # Scenes management
    "bevy/bevy_sprite",        # 2D sprites
    "bevy/bevy_sprite_render", # Rendering for sprites
    "bevy/bevy_shader",        # Shaders
    "bevy/bevy_text",          # Text/font rendering
    "bevy/bevy_ui",            # UI toolkit
    "bevy/bevy_ui_render",     # UI GPU rendering (TransparentUi phase) - Text ui
    "bevy/bevy_winit",         # Window management (cross-platform Winit backend)
    "bevy/default_font",       # Embed a minimal default font for text/UI
    "bevy/png",                # Screenshot feature to save a png to disk
    "bevy/keyboard",
    "bevy/mouse",

    "bevy/x11",                # winit wants a linux backend, x11 dlopen only so builds on headless linux
]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
ron = "0.12.2"

# To permit ship dyn object to be cloned (so that they all have their own memory region for data)
dyn-clone = "1.0.20"

[dependencies.avian2d]
version = "0.8.0-dev"
default-features = false
features = [
    "2d",
    "parry-f32",
    "parallel",
]
git = "https://github.com/andriyDev/avian"
branch = "bevy-0.20"

[dependencies.lyon_tessellation]
version = "1.0"
optional = true

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "bevy_log",           # Enable logging output
    "bevy_state",         # Enable built in global state machines
    "bevy_asset",         # Asset management
    "file_watcher",       # Asset file watcher

    "std",
    "async_executor",
    "multi_threaded",     # Run with multithreading
    "dynamic_linking",    # Speed up dev compilation
    "debug"               # Retains ECS system/component names
]
